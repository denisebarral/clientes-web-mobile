<html class="h-full" lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <body class="h-full">
    <!-- 
      # ¿Cómo manejamos los casos donde necesitamos valores arbitrarios en Tailwind?
      Tenemos algunas opciones.
      Para un caso como este, donde queremos tener un valor específico para un estilo
      (grid-template-rows: 60px 1fr 100px;) podemos crear una clase con un valor
      arbitrario.
      Esto es podemos en el lugar donde va el valor en el nombre de la clase podemos
      escribir el valor arbitrario que queremos entre [].
      Por ejemplo:
        text-[valorX]

      Importante: Recuerden que los espacios no son caracteres válidos para nombres de
      clases. Si nuestro valor arbitrario contiene espacios, debemos reemplazarlos
      por "_".
    -->
    <div id="app" class="grid grid-rows-[60px_1fr_100px] h-full"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
